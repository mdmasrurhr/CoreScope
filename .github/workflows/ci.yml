name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/CoreScope/CoreScope.csproj -c Release -nologo
      - name: Test
        run: dotnet test tests/CoreScope.Tests -c Release -nologo
